[project]
name = "tablut-challenge"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "mengxian0913", email = "mengxian0913@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
tablut-challenge = "tablut_challenge:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
